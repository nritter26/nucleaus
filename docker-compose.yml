name: nucleaus

services:
  hub:
    build:
      context: .
      dockerfile: Dockerfile
    image: nucleaus-hub
    container_name: nucleaus-hub
    restart: unless-stopped
    environment:
      PORT: ${PORT:-9088}
      PROMETHEUS_URL: http://prometheus:9090
      SNIPPETS_DB: /data/nucleaus.db
    volumes:
      - hub-data:/data
    ports:
      - "${PORT:-9088}:${PORT:-9088}"
    networks:
      - nucleus
      - monitoring
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -qO- http://127.0.0.1:$${PORT:-9088}/healthz || exit 1",
        ]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  sqlite-web:
    image: ghcr.io/coleifer/sqlite-web:latest
    container_name: nucleaus-sqlite-web
    restart: unless-stopped
    command: ["-H", "0.0.0.0", "-x", "/data/nucleaus.db"]
    volumes:
      - hub-data:/data
    ports:
      - "${SQLITE_WEB_PORT:-1297}:8080"
    networks:
      - nucleus
    depends_on:
      hub:
        condition: service_started

networks:
  nucleus:
    driver: bridge
  monitoring:
    external: true
    name: monitoring

volumes:
  hub-data:

