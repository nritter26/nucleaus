services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-nucleaus}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-nucleaus}
      POSTGRES_DB: ${POSTGRES_DB:-nucleaus}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-nucleaus} -d ${POSTGRES_DB:-nucleaus}"]
      interval: 5s
      timeout: 3s
      retries: 12

  hub:
    build: .
    image: nucleaus-hub
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PORT: ${PORT:-9088}
      DATABASE_URL: postgres://${POSTGRES_USER:-nucleaus}:${POSTGRES_PASSWORD:-nucleaus}@db:5432/${POSTGRES_DB:-nucleaus}?sslmode=disable
    ports:
      - "${PORT:-9088}:${PORT:-9088}"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:${PORT:-9088}/healthz || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  db-data:
